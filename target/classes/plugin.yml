name: ChloeManager
version: 1.0.0
main: com.chloe.chloemanager.ChloeManagerPlugin
api-version: 1.20
description: A Minecraft plugin built with MVC architecture
author: Chloe

commands:
  hello:
    description: A sample hello command to demonstrate MVC
    usage: /hello [player]
    permission: chloemanager.hello

permissions:
  chloemanager.hello:
    description: Allows use of the /hello command
    default: op
  chloemanager.admin:
    description: Full admin access to ChloeManager
    default: op
