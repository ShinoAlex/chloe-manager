name: ChloeManager
version: 1.6.0
main: com.chloe.chloemanager.ChloeManagerPlugin
api-version: 1.20
description: A Minecraft plugin built with MVC architecture
author: Chloe

commands:
  hello:
    description: A sample hello command to demonstrate MVC
    usage: /hello [player]
    permission: chloemanager.hello

  sell:
    description: Open the sell GUI or sell all sellable items
    usage: /sell [all]
    permission: chloemanager.economy.sell

  balance:
    description: Check your balance or another player's balance
    usage: /balance [player]
    permission: chloemanager.economy.balance
    aliases: [bal]

  bal:
    description: Shortcut to check your own balance
    usage: /bal
    permission: chloemanager.economy.balance

  baltop:
    description: View the top 10 richest players
    usage: /baltop
    permission: chloemanager.economy.baltop

  pay:
    description: Pay another online player money
    usage: /pay <player> <amount>
    permission: chloemanager.economy.pay

  shop:
    description: Open the shop to buy items
    usage: /shop
    permission: chloemanager.economy.shop

  taixiu:
    description: Tài Xỉu dice gambling game
    usage: /taixiu [bet|toggle]
    permission: chloemanager.taixiu

  ah:
    description: Open the Black Market or list items for sale
    usage: /ah [sell <price> [amount]]
    permission: chloemanager.ah

  bank:
    description: Open the bank GUI or view help
    usage: /bank [help]
    permission: chloemanager.bank

  deposit:
    description: Deposit money into the bank
    usage: /deposit <amount|all>
    permission: chloemanager.bank

  withdraw:
    description: Withdraw money from the bank
    usage: /withdraw <amount|all>
    permission: chloemanager.bank

  sethome:
    description: Set your home location (slots 1-3)
    usage: /sethome [1|2|3]
    permission: chloemanager.home

  home:
    description: Teleport to your home ($1000, 5s warmup, cancels on damage)
    usage: /home [1|2|3]
    permission: chloemanager.home

  boss:
    description: Open the boss trade GUI, or spawn a test boss (admin)
    usage: /boss [spawn [difficulty]]
    permission: chloemanager.boss

  clan:
    description: Manage your clan (create, add, kick, delete, inventory, leave)
    usage: /clan <create|add|kick|delete|inventory|leave|info> [args]
    permission: chloemanager.clan

permissions:
  chloemanager.hello:
    description: Allows use of the /hello command
    default: op

  chloemanager.economy.sell:
    description: Allows use of /sell and /sell all
    default: true

  chloemanager.economy.balance:
    description: Allows use of /balance and /bal
    default: true

  chloemanager.economy.baltop:
    description: Allows use of /baltop
    default: true

  chloemanager.economy.pay:
    description: Allows use of /pay
    default: true

  chloemanager.economy.shop:
    description: Allows use of /shop
    default: true

  chloemanager.taixiu:
    description: Allows use of /taixiu
    default: true

  chloemanager.ah:
    description: Allows use of /ah black market
    default: true

  chloemanager.bank:
    description: Allows use of /bank, /deposit, /withdraw
    default: true

  chloemanager.home:
    description: Allows use of /sethome and /home
    default: true

  chloemanager.boss:
    description: Allows use of /boss trade GUI
    default: true

  chloemanager.boss.spawn:
    description: Allows /boss spawn [difficulty] for admin testing
    default: op

  chloemanager.clan:
    description: Allows use of /clan commands
    default: true

  chloemanager.admin:
    description: Full admin access to ChloeManager
    default: op
